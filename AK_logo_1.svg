<!-- Logo 1: Gold monogram on dark navy circle with subtle ring -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e2d52"/>
      <stop offset="100%" stop-color="#0a1024"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="50%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#f6d365" stroke-width="1.5" opacity="0.4"/>
  <!-- inner ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#f6d365" stroke-width="0.5" opacity="0.2"/>
  <!-- background circle -->
  <circle cx="100" cy="100" r="88" fill="url(#bg1)"/>
  <!-- A letter -->
  <text x="38" y="130" font-family="Georgia, serif" font-size="98" font-weight="700"
        fill="url(#gold1)" letter-spacing="-6">A</text>
  <!-- K letter -->
  <text x="96" y="130" font-family="Georgia, serif" font-size="98" font-weight="700"
        fill="url(#gold1)" letter-spacing="-6">K</text>
  <!-- thin gold underline -->
  <line x1="42" y1="142" x2="158" y2="142" stroke="#f6d365" stroke-width="1.5" opacity="0.6"/>
</svg>
